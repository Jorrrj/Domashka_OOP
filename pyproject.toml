[tool.poetry]
name = "domashka-oop"
version = "0.1.0"
description = ""
authors = ["Yuriy Kurilenko <kurilenko816@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.isort]
# максимальная длина строки
line_length = 119

